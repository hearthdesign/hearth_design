{% load static %}

<!-- hearth_shop/templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}HEARTH SHOP{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'shop/js/main.js' %}" defer></script>
</head>
<body>
    <header>
        <h1>Hearth Shop</h1>
        {% include 'includes/navbar.html' %}
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
    <div id="image-modal" style="display:none;" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <img src="" alt="" id="modal-image">
        <h3 id="modal-title"></h3>
        
<!-- Modal form for adding product to cart -->
<form method="post" action="{% url 'add_to_cart' %}">
  {% csrf_token %}
  <!-- Hidden input for product ID -->
  <input type="hidden" name="product_id" id="modal-product-id">
  <!-- Quantity selector -->
  <label for="quantity">Quantity:</label>
  <input type="number" name="quantity" id="modal-quantity" value="1" min="1">
  <!-- Submit button -->
  <button type="submit">Add to Cart</button>
</form>
      </div>
    </div>
    <footer>
        <p>&copy; 2025 HEARTH Shop</p>
    </footer>
</body>
</html>
