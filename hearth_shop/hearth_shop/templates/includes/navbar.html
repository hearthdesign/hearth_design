<!-- includes/navbar.html -->
<nav>
    <ul>
        <li><a href="{% url 'homepage' %}">Home</a></li>
        <li><a href="{% url 'illustration_gallery' %}">Illustrations</a></li>
        <li><a href="{% url 'photography_gallery' %}">Photographies</a></li>
        {% if user.is_authenticated %}
            <li><a href="{% url 'logout' %}">Logout</a></li>
        {% else %}
            <li><a href="{% url 'login' %}">Login</a></li>
        {% endif %}
    </ul>
    <a href="{% url 'cart_view' %}" class="cart-link">🛒 Cart</a>


    <form method="get" action="{% url 'theme_filter' %}">
        <select name="theme">
            {% for theme in themes %}
                <option value="{{ theme.slug }}">{{ theme.name }}</option>
            {% endfor %}
        </select>
        <button type="submit">Filter</button>
    </form>
    
</nav>
