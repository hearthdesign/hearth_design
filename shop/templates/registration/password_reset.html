{% extends 'base.html' %}
{% load i18n %}
<!-- Password reset form -->
{% block content %}
  <h2>{% trans "Reset your password" %}</h2>
  <p>{% trans "Enter your email address and we'll send you a link to reset your password." %}</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% trans "Send reset link" %}</button>
  </form>
{% endblock %}
