{% extends 'hearth_shop/base.html' %}
{% load i18n %}

<!-- Password change done page -->
<!-- when a logged‑in user changes their password from inside their account -->
{% block title %}{% trans "Password Changed" %} - {% trans "HEARTH Shop" %}{% endblock %}

{% block content %}
<section class="status-container" aria-labelledby="password-changed-heading">
  <h1 id="password-changed-heading">{% trans "Password Changed" %}</h1>

  <div role="status" aria-live="polite">
    <p>{% trans "Your password has been changed successfully." %}</p>
  </div>

  <nav class="status-actions" aria-label="{% trans 'Account navigation' %}">
    <a href="{% url 'shop_home' %}" class="status-btn" aria-label="{% trans 'Return to the shop homepage' %}">
      {% trans "Back to Home" %}
    </a>
  </nav>
</section>
{% endblock %}
