{% extends 'hearth_shop/base.html' %}
{% load i18n %}
<!-- Password reset email -->
{% block content %}
  <p>{% trans "You have requested a password reset." %}</p>
  <p>{% trans "Please click the link below to reset your password:" %}</p>
  <p><a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}">
    {% trans "Reset password" %}</a></p>
{% endblock %}
