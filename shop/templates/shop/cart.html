{% extends 'base.html' %}
{% load i18n %}
<!-- Cart -->
{% block content %}
{% for item in cart_items %}
  <p>{{ item.print.title }} - €{{ item.print.price }}</p>
  <p>Quantity: {{ item.quantity }}</p>
  <p>Total: €{{ item.total }}</p>
{% endfor %}

<p><strong>Total: €{{ cart_total }}</strong></p>

<a href="{% url 'create_checkout_session' %}">
  {% trans "Buy with Stripe" %}
</a>

{% endblock %}
