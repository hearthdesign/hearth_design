{% extends 'base.html' %}
{% load i18n %}
<!-- Upload form -->
{% block title %}{% trans "Upload a New Print" %}{% endblock %}
{% block content %}

<h2>{% trans "Upload a New Print" %}</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
        <button type="submit" class="btn-primary">{% trans "Upload" %}</button>
        <a href="javascript:history.back()" class="btn-secondary">{% trans "Cancel" %}</a>
    </div>
</form>
{% endblock %}
