{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Upload a New Print" %}{% endblock %}
{% block content %}

<h2>{% trans "Upload a New Print" %}</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% trans "Upload" %}</button>
</form>
{% endblock %}
