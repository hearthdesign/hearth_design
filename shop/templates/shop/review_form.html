{% load i18n %}

<form method="POST" class="review-form">
    {% csrf_token %}
    
    <!-- Rating Field -->
    <div class="form-group">
        <label for="{{ form.rating.id_for_label }}">{% trans "Rating:" %}</label>
        {{ form.rating }}
    </div>

    <!-- Comment Field -->
    <div class="form-group">
        <label for="{{ form.comment.id_for_label }}">{% trans "Your Review:" %}</label>
        {{ form.comment }}
    </div>

    <!-- Honeypot Spam Trap (Hidden via CSS) -->
    <div aria-hidden="true" style="opacity: 0; position: absolute; top: 0; left: 0; height: 0; width: 0; z-index: -1;">
        <label for="{{ form.website.id_for_label }}">Website</label>
        {{ form.website }}
    </div>

    <button type="submit" class="cta-button">{% trans "Post Review" %}</button>
</form>
